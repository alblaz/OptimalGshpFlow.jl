name: CI
# Keep CI fast and lean: skip docs-only changes and run 'pre' only on manual dispatch. Pushes to
# main still run once: PR runs can only restore caches of their own branch or of main, so the
# main run keeps a fresh depot cache that every new PR starts from.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'examples/**'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'examples/**'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Portable native code in the precompile cache (as the official binaries). Without it the
      # cached packages are compiled for the CPU of the runner that built them and rejected
      # ("runtime-disabled features") when the next run lands on a different CPU model.
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)"
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # '1': latest stable release; 'min': minimum version allowed by the julia compat entry
        # (1.10, also the current LTS: no separate 'lts' job); 'pre': upcoming release, manual only
        version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["1", "min", "pre"]' || '["1", "min"]') }}
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
        with:
          # Versioned name: the cache key does not include build settings (CPU target, coverage),
          # and a depot built with other settings is restored, then rejected at load time
          # ("Precompiled image ... not available with flags"). Bump when those settings change.
          cache-name: julia-cache-v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # no coverage upload is configured; with coverage on, Julia >= 1.12 re-precompiles
          # all ~250 dependencies on every run (≈ 13 min) and the tests run slower
          coverage: false
